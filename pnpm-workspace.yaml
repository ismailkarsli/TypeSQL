packages:
  - packages/*
  - tests
  - tests/scenarios/*
allowBuilds:
  esbuild: true
  workerd: true
  "@prisma/engines": true
  prisma: false
  "@vscode/vsce-sign": false
  better-sqlite3: true
versioning:
  changelog:
    storage: repository
  fixed:
    - - "@typesql/core"
      - "@typesql/pg"
      - "@typesql/postgres"
      - "@typesql/kysely"
      - "@typesql/drizzle"
      - "@typesql/prisma"
      - "@typesql/sqlite"
      - "@typesql/mysql"
      - "@typesql/cli"
      - "@typesql/better-auth"
linkWorkspacePackages: false
autoInstallPeers: false
hoist: false
dedupePeerDependents: false
resolvePeersFromWorkspaceRoot: false
minimumReleaseAgeExcludePrune: true
overrides:
  "vitepress>vite": 6.4.5
catalog:
  "@biomejs/biome": 2.6.5
  knip: 6.44.1
  tsrs: 0.21.0-ts7.1.0-beta
  typescript: 7.1.0-beta
  "@types/node": 26.6.6
  vitest: 5.1.0
  vite: 8.3.5
  pg: 8.23.1
  "@types/pg": 8.23.1
  postgres: 4.0.0
  kysely: 0.29.8
  drizzle-orm: 0.45.4
  "@tidbcloud/serverless": 0.3.0
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/adapter-better-sqlite3": 7.10.1
  "@prisma/adapter-mariadb": 7.10.1
  better-sqlite3: 13.0.3
  "@types/better-sqlite3": 9.6.0
  mysql2: 3.24.6
  mariadb: 3.5.5
  bun: tool:1.4.4
  "@types/bun": 1.4.4
  better-auth: 1.7.17
  "@better-fetch/fetch": 1.3.3
  better-call: 1.4.5
  jose: 6.2.15
  nanostores: 1.5.5
  zod: 4.6.7
  cf: 1.0.0-beta.27
  vitepress: 1.6.4
  vue: 3.5.44
  wrangler: 4.157.0
  "@vscode/vsce": 4.1.0
  esbuild: 0.28.2
  ovsx: 1.3.0
