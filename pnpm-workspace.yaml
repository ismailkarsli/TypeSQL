packages:
  - packages/*
  - tests
  - tests/scenarios/*
allowBuilds:
  esbuild: true
  workerd: true
  "@prisma/engines": true
  prisma: false
  "@vscode/vsce-sign": false
  better-sqlite3: true
versioning:
  changelog:
    storage: repository
  fixed:
    - - "@typesql/core"
      - "@typesql/pg"
      - "@typesql/postgres"
      - "@typesql/kysely"
      - "@typesql/drizzle"
      - "@typesql/prisma"
      - "@typesql/sqlite"
      - "@typesql/cli"
      - "@typesql/better-auth"
linkWorkspacePackages: false
autoInstallPeers: false
hoist: false
dedupePeerDependents: false
resolvePeersFromWorkspaceRoot: false
overrides:
  "vite@5>esbuild": 0.24.2
catalog:
  vitest: 5.0.5
  typescript: 7.1.0-beta
  "@types/node": 26.6.6
  pg: 8.23.1
  "@types/pg": 8.23.1
  postgres: 4.0.0
  kysely: 0.29.8
  drizzle-orm: 0.45.4
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/adapter-better-sqlite3": 7.10.1
  better-sqlite3: 13.0.3
  "@types/better-sqlite3": 9.6.0
  "@types/bun": 1.4.4
  vite: 8.3.5
  better-auth: 1.7.14
  "@better-fetch/fetch": 1.3.3
  better-call: 1.4.4
  jose: 6.2.15
  nanostores: 1.5.5
  zod: 4.6.7
