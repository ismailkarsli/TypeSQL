packages:
  - packages/*
  - tests
  - tests/scenarios/*
allowBuilds:
  esbuild: true
  workerd: true
  "@prisma/engines": true
  prisma: false
  "@vscode/vsce-sign": false
  better-sqlite3: true
versioning:
  changelog:
    storage: repository
  fixed:
    - - "@typesql/core"
      - "@typesql/pg"
      - "@typesql/postgres"
      - "@typesql/kysely"
      - "@typesql/drizzle"
      - "@typesql/prisma"
      - "@typesql/sqlite"
      - "@typesql/mysql"
      - "@typesql/cli"
      - "@typesql/better-auth"
      - "@typesql/effect"
linkWorkspacePackages: false
autoInstallPeers: false
hoist: false
dedupePeerDependents: false
resolvePeersFromWorkspaceRoot: false
minimumReleaseAgeExcludePrune: true
overrides:
  # VitePress 1 needs Vite 5; 5.4.21 has dev server advisories.
  # Drop once a stable VitePress uses Vite 6+.
  "vitepress>vite": 6.4.5
  # vsce 4.1.1 needs minimatch ^10; no 10.x fixes GHSA-g3hv-75wg-m249.
  # Drop once vsce allows minimatch >=11.0.1.
  "@vscode/vsce>minimatch": 11.0.8
catalog:
  "@biomejs/biome": 2.6.7
  knip: 6.45.1
  tsrs: 0.25.0-ts7.1.0-beta
  typescript: 7.1.0-beta
  "@types/node": 26.6.6
  vitest: 5.1.0
  vite: 8.3.8
  pg: 8.23.1
  "@types/pg": 8.23.1
  postgres: 4.1.1
  kysely: 0.29.9
  drizzle-orm: 0.45.4
  "@tidbcloud/serverless": 0.3.0
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/adapter-better-sqlite3": 7.10.1
  "@prisma/adapter-mariadb": 7.10.1
  better-sqlite3: 13.1.1
  "@types/better-sqlite3": 9.6.0
  mysql2: 3.24.6
  mariadb: 3.5.5
  bun: tool:1.4.4
  "@types/bun": 1.4.4
  effect: 4.1.4
  "@effect/sql-pg": 4.1.4
  "@effect/sql-sqlite-node": 4.1.4
  "@effect/sql-mysql2": 4.1.4
  better-auth: 1.7.23
  "@better-fetch/fetch": 1.3.3
  better-call: 1.4.5
  jose: 6.2.17
  nanostores: 1.5.5
  zod: 4.6.7
  cf: 1.0.0-beta.31
  vitepress: 1.6.4
  vue: 3.5.45
  wrangler: 4.162.0
  "@vscode/vsce": 4.1.1
  esbuild: 0.28.2
  ovsx: 1.4.0
minimumReleaseAgeExclude:
  - better-call@1.4.5
  - mariadb@3.5.5
