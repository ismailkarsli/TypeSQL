packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  workerd: true
  "@prisma/engines": false
  prisma: false
  "@vscode/vsce-sign": false
versioning:
  changelog:
    storage: repository
  fixed:
    - - "@typesql/core"
      - "@typesql/pg"
      - "@typesql/postgres"
      - "@typesql/kysely"
      - "@typesql/drizzle"
      - "@typesql/prisma"
      - "@typesql/sqlite"
      - "@typesql/cli"
