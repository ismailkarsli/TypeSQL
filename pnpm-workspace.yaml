packages:
  - packages/*
  - tests
  - tests/scenarios/*
allowBuilds:
  esbuild: true
  workerd: true
  "@prisma/engines": true
  prisma: false
  "@vscode/vsce-sign": false
  better-sqlite3: true
versioning:
  changelog:
    storage: repository
  fixed:
    - - "@typesql/core"
      - "@typesql/pg"
      - "@typesql/postgres"
      - "@typesql/kysely"
      - "@typesql/drizzle"
      - "@typesql/prisma"
      - "@typesql/sqlite"
      - "@typesql/mysql"
      - "@typesql/cli"
      - "@typesql/better-auth"
      - "@typesql/effect"
linkWorkspacePackages: false
autoInstallPeers: false
hoist: false
dedupePeerDependents: false
resolvePeersFromWorkspaceRoot: false
minimumReleaseAgeExcludePrune: true
overrides:
  # Prisma config pins Effect 3.20.0, affected by GHSA-7589-6fvf-x4pw.
  # Drop once Prisma config uses Effect >=3.22.1.
  "@prisma/config>effect": 3.22.1
  # Satori pins fflate 0.7.3; its font parser also accepts that version.
  # Drop once both use a version patched for GHSA-px8p-9vwx-vf98.
  "fflate@0.7.3": 0.7.5
  # VitePress 1 needs Vite 5; 5.4.21 has dev server advisories.
  # Drop once a stable VitePress uses Vite 6+.
  "vitepress>vite": 6.4.5
  # vsce 4.1.1 needs minimatch ^10; no 10.x fixes GHSA-g3hv-75wg-m249.
  # Drop once vsce allows minimatch >=11.0.1.
  "@vscode/vsce>minimatch": 11.0.8
catalog:
  "@biomejs/biome": 2.6.8
  knip: 6.47.0
  tsrs: 7.1.0-beta.tsrs3
  typescript: 7.1.0-beta
  "@types/node": 26.6.6
  vitest: 5.1.1
  vite: 8.3.8
  pg: 8.23.1
  "@types/pg": 8.23.1
  postgres: 4.1.1
  kysely: 0.29.9
  drizzle-orm: 0.45.4
  "@tidbcloud/serverless": 0.3.0
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/adapter-better-sqlite3": 7.10.1
  "@prisma/adapter-mariadb": 7.10.1
  better-sqlite3: 13.2.0
  "@types/better-sqlite3": 9.6.0
  mysql2: 3.24.6
  mariadb: 3.5.5
  bun: runtime:1.4.5
  "@types/bun": 1.4.5
  effect: 4.1.5
  "@effect/sql-pg": 4.1.5
  "@effect/sql-sqlite-node": 4.1.5
  "@effect/sql-mysql2": 4.1.5
  better-auth: 1.7.27
  "@better-fetch/fetch": 1.3.3
  better-call: 1.4.6
  jose: 6.2.18
  nanostores: 1.5.5
  zod: 4.6.7
  cf: 1.0.0-rc.2
  vitepress: 1.6.4
  vue: 3.5.46
  wrangler: 4.165.0
  satori: 0.63.2
  "@resvg/resvg-js": 2.6.2
  "@fontsource/inter": 5.3.0
  "@fontsource/jetbrains-mono": 5.3.0
  "@vscode/vsce": 4.1.1
  esbuild: 0.28.2
  ovsx: 1.4.0
