id = "typesql"
name = "TypeSQL"
description = "Completions for tables and columns inside TypeSQL's sql() strings."
version = "0.0.1"
schema_version = 1
authors = ["İsmail Karslı"]
repository = "https://github.com/ismailkarsli/typesql"

[language_servers.typesql]
