services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    platform: linux/amd64
    environment:
      POSTGRES_PASSWORD: typesql
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      TZ: UTC
    command: [postgres, -c, timezone=UTC, -c, "datestyle=ISO,YMD"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d postgres]
      interval: 1s
      timeout: 5s
      retries: 60
  suite:
    init: true
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: tests/environment/Dockerfile
    environment:
      TYPESQL_DATABASE_URL: postgres://postgres:typesql@postgres:5432/postgres
      CONSUMER_ARTIFACTS: /artifacts/${TYPESQL_CONSUMER_RUN_ID:-manual}
    volumes:
      - ../.artifacts:/artifacts
      - ../scenarios:/checkout/tests/scenarios
    depends_on:
      postgres:
        condition: service_healthy
