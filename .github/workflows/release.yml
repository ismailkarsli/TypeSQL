name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

# Privileged jobs build only owner-dispatched main commits, with no restored caches.
# Check both identities so reruns cannot inherit the original actor's authorization.

jobs:
  publish:
    name: publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ismailkarsli/TypeSQL' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write # Create the signed version commit and GitHub releases.
      id-token: write # Authenticate to npm through trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - name: Version pending change intents
        run: |
          public() {
            pnpm -r ls --depth -1 --json | node -e '
              for (const p of JSON.parse(require("fs").readFileSync(0)))
                if (!p.private) console.log(`${p.name}@${p.version}`)'
          }
          before=$(public)
          for pkg in $before; do
            if ! pnpm view "$pkg" version >/dev/null 2>&1; then
              name=${pkg%@*}
              dir="packages/${name##*/}"
              if [ -f "$dir/CHANGELOG.md" ]; then
                echo "::notice::$pkg has an unpublished release; publishing without versioning"
                exit 0
              fi
              echo "::notice::$pkg is a first release; versioning its pending intents"
            fi
          done
          pnpm change status
          pnpm version -r
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          versions=$(comm -13 <(sort <<<"$before") <(public | sort) | sed 's/.*@//' | sort -uV | paste -sd, - | sed 's/,/, /g')
          extension=$(node -p 'require("./packages/vscode/package.json").version')
          if [ -z "$versions" ] && [ "$extension" != "$(git show HEAD:packages/vscode/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" ]; then
            versions="VS Code extension $extension"
          fi
          git add -A
          message="chore: release $versions"
          [ -n "$versions" ] || message="chore: update release metadata"
          release_commit=$(node tools/github-commit.ts main "$message")
          git fetch origin "$release_commit"
          git reset --hard "$release_commit"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - name: Publish packages with trusted publishing
        run: |
          mapfile -t packages < <(pnpm -r ls --depth -1 --json | node -e '
            for (const p of JSON.parse(require("fs").readFileSync(0)))
              if (!p.private) console.log(p.name)')
          filters=()
          new=()
          for pkg in "${packages[@]}"; do
            if ! pnpm view "$pkg" version >/dev/null 2>&1; then
              filters+=(--filter "!$pkg")
              new+=("$pkg")
            fi
          done
          : > .new-packages
          if ((${#new[@]})); then
            printf '%s\n' "${new[@]}" > .new-packages
          fi
          pnpm publish -r --no-git-checks --report-summary "${filters[@]}"
      - run: node tools/github-releases.ts --summary pnpm-publish-summary.json --current
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check first-time npm packages
        run: |
          if [ -s .new-packages ]; then
            echo "::error::Publish these packages once with npm login from this release commit, configure their trusted publishers, then run release again: $(paste -sd, .new-packages)"
            exit 1
          fi

  docs:
    name: docs
    needs: publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ismailkarsli/TypeSQL' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  extension:
    name: extension
    needs: publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ismailkarsli/TypeSQL' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vscode
    permissions:
      contents: read
      id-token: write # Authenticate to Azure and Open VSX through trusted publishing.
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.publish.outputs.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "typesql..." run build
      - run: pnpm exec vsce package --no-dependencies --out typesql.vsix
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: vars.VSCODE_MARKETPLACE == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace identity
        if: vars.VSCODE_MARKETPLACE == 'true'
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
      - name: Publish to the Visual Studio Marketplace
        if: vars.VSCODE_MARKETPLACE == 'true'
        run: pnpm exec vsce publish --azure-credential --packagePath typesql.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: vars.OPEN_VSX == 'true'
        run: pnpm exec ovsx publish typesql.vsix --trusted-publishing --skip-duplicate
