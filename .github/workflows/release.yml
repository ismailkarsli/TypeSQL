name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: packages/bench
      - name: Version pending change intents
        run: |
          public() {
            pnpm -r ls --depth -1 --json | node -e '
              for (const p of JSON.parse(require("fs").readFileSync(0)))
                if (!p.private) console.log(`${p.name}@${p.version}`)'
          }
          before=$(public)
          for pkg in $before; do
            if ! pnpm view "$pkg" version >/dev/null 2>&1; then
              echo "::notice::$pkg is not on npm yet; publishing without versioning"
              exit 0
            fi
          done
          pnpm change status
          pnpm version -r
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          versions=$(comm -13 <(sort <<<"$before") <(public | sort) | sed 's/.*@//' | sort -uV | paste -sd, - | sed 's/,/, /g')
          extension=$(node -p 'require("./packages/vscode/package.json").version')
          if [ -z "$versions" ] && [ "$extension" != "$(git show HEAD:packages/vscode/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" ]; then
            versions="VS Code extension $extension"
          fi
          node scripts/performance-history.ts --refresh-all
          git add -A
          message="chore: release $versions"
          [ -n "$versions" ] || message="chore: update release metadata"
          node scripts/github-commit.ts main "$message"
          git fetch origin main
          git reset --hard origin/main
        env:
          GH_TOKEN: ${{ github.token }}
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - run: pnpm smoke:dist
      - run: pnpm publish -r --no-git-checks --report-summary
      - run: node scripts/github-releases.ts --summary pnpm-publish-summary.json
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  extension:
    needs: publish
    runs-on: ubuntu-latest
    environment: vscode
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "typesql..." run build
      - run: pnpm exec vsce package --no-dependencies --out typesql.vsix
      - uses: azure/login@v2
        if: vars.VSCODE_MARKETPLACE == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace identity
        if: vars.VSCODE_MARKETPLACE == 'true'
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
      - name: Publish to the Visual Studio Marketplace
        if: vars.VSCODE_MARKETPLACE == 'true'
        run: pnpm exec vsce publish --azure-credential --packagePath typesql.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: vars.OPEN_VSX == 'true'
        run: pnpm exec ovsx publish typesql.vsix --trusted-publishing --skip-duplicate
