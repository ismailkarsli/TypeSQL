name: release

# Started by hand only (`pnpm release`, or "Run workflow" on the Actions tab), never by a push.
# Runs the ci.yml checks on main, then publishes every package version that is not on npm yet,
# i.e. those of pushed `pnpm version -r` release commits, through npm trusted publishing (OIDC,
# no token), and creates their GitHub releases. npm trusts this workflow file (release.yml) in
# the `npm` environment, which only deploys from main; see packages/docs/internals/releasing.md.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # github-releases.mjs reads changelog sections from history
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke:dist
      # The workflow only gets here on main, which is what publish's git checks verify.
      - run: pnpm publish -r --no-git-checks --report-summary
      - run: node scripts/github-releases.mjs --summary pnpm-publish-summary.json
        env:
          GH_TOKEN: ${{ github.token }}
