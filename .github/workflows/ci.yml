name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Conformance tests run against this server instead of starting their own container.
      TYPESQL_PG_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:dist
      - run: pnpm test
      - run: pnpm docs:build

  bench:
    # Compile-time budget gate: fails when instantiation counts or check time exceed
    # packages/bench/thresholds.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/bench/gen.mjs
      - run: node packages/bench/run.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-results
          path: packages/bench/results.json
