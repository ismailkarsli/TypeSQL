name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Conformance tests run against this server instead of starting their own container.
      TYPESQL_PG_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm change check
      - run: pnpm cache-version --check
      - run: pnpm typecheck
      - run: pnpm playground --check
      - run: pnpm build
      - run: pnpm smoke:dist
      - run: pnpm test
      - run: pnpm docs:build

  intents:
    # A change to a published package's shipped files must come with a change intent
    # (`pnpm change`); see packages/docs/internals/releasing.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node scripts/check-intents.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  bench:
    # Compile-time budget gate: fails when instantiation counts or check time exceed
    # packages/bench/thresholds.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/bench/gen.mjs
      # the cached variants run the content mapper and job from the built package
      - run: pnpm --filter @typesql/core build
      - run: node packages/bench/run.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: packages/bench/results.json
