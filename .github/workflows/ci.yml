name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Conformance tests run against this server instead of starting their own container.
      TYPESQL_PG_URL: postgres://postgres:typesql@localhost:5432/postgres
      TYPESQL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm change check
      - run: pnpm lint
      - run: pnpm cache-version --check
      - run: pnpm typecheck
      - run: pnpm playground --check
      - run: pnpm build
      - run: pnpm smoke:dist
      # the VS Code extension packages (release.yml publishes the same .vsix)
      - run: pnpm --filter typesql exec vsce package --no-dependencies --out "$RUNNER_TEMP/typesql.vsix"
      - run: pnpm coverage
      - run: pnpm check:expect-error
      - run: pnpm docs:build

  intents:
    # A change to a published package's shipped files must come with a change intent
    # (`pnpm change`); see packages/docs/internals/releasing.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node scripts/check-intents.ts "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  pg-regress:
    # The parser against PostgreSQL's own regression tests (vendor/postgres). Fails on a
    # disagreement with Postgres that is not in packages/core/test/pg-regress/baseline.json,
    # and on a listed one that went away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pg-regress:setup
      - run: pnpm test:pg-regress
      - run: pnpm test:pg-ast

  oracle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TYPESQL_ORACLE_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:oracle

  oracle-regress:
    # The server is started here rather than as a service: the replay COPYs the regression
    # tests' data files, mounted from the checkout.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TYPESQL_ORACLE_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: did the engine change?
        id: engine
        run: |
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=$(git merge-base origin/main HEAD); fi
          if git diff --quiet "$base" HEAD -- packages/core/src/engine; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
        if: steps.engine.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.engine.outputs.changed == 'true'
        with:
          node-version: 26
          cache: pnpm
      - if: steps.engine.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.engine.outputs.changed == 'true'
        run: pnpm pg-regress:setup
      - name: start postgres:18
        if: steps.engine.outputs.changed == 'true'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=typesql -p 5432:5432 \
            -v "$PWD/vendor/postgres/src/test/regress:/regress:ro" postgres:18
          until docker exec pg pg_isready -U postgres -h localhost; do sleep 1; done
      - if: steps.engine.outputs.changed == 'true'
        run: pnpm test:oracle --regress --views --shard ${{ matrix.shard }}/4

  fuzz:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TYPESQL_ORACLE_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fuzz

  bench:
    # Compile-time budget gate: fails when instantiation counts or check time exceed
    # packages/bench/thresholds.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # remeasure every core release on this runner
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/bench/history.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            packages/bench/results.json
            packages/bench/runtime-results.json
            packages/bench/history-results.json
