name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Skipped for now: the stricter Biome rules report errors across the repository.
      - run: pnpm lint
        if: false
      - run: pnpm typecheck
      - run: pnpm playground --check
      - run: pnpm build
      - run: pnpm --filter typesql exec vsce package --no-dependencies --out "$RUNNER_TEMP/typesql.vsix"
      - run: pnpm docs:build

  intents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node scripts/check-intents.ts "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests typecheck
      - name: Start PostgreSQL
        run: docker compose -f tests/compose.yaml up --detach --wait
      - run: pnpm test
      - name: Retain failing consumer applications and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-failures
          path: tests/.artifacts/
          include-hidden-files: true
          retention-days: 7
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f tests/compose.yaml down --volumes --remove-orphans
