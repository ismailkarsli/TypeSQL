name: stryker

# The incremental results are an artifact rather than the Actions cache, which drops entries
# unused for 7 days. Incremental runs miss changes to code the tests call but Stryker does not
# mutate, so every mutant is tested again on the first Sunday of the month.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Test every mutant again, ignoring the last run's results
        type: boolean
        default: false

concurrency:
  group: stryker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read # the last run's results
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: typesql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TYPESQL_PG_URL: postgres://postgres:typesql@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the last successful run's results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ hashFiles('pnpm-lock.yaml', 'stryker.config.ts', 'vitest.stryker.config.ts') }}
        run: |
          id=$(gh run list --workflow stryker.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ] || ! gh run download "$id" --name stryker-incremental --dir "$RUNNER_TEMP/previous"; then
            echo "no previous results: every mutant is tested"
          elif [ ! -f "$RUNNER_TEMP/previous/stryker-incremental.json" ] || [ "$(cat "$RUNNER_TEMP/previous/stryker-incremental.key" 2>/dev/null)" != "$KEY" ]; then
            echo "dependencies or Stryker configuration changed since run $id: every mutant is tested"
          else
            mkdir -p reports && mv "$RUNNER_TEMP/previous/stryker-incremental.json" reports/
            echo "results of run $id"
          fi
      # the editor completion test (a runtime mutant's test) imports the built adapters
      - run: pnpm build
      - name: pnpm mutate:runtime --shard ${{ matrix.shard }}/4 --incremental
        run: |
          force=
          if [ "${{ inputs.force }}" = true ]; then force=--force; fi
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%d)" -le 7 ]; then force=--force; fi
          pnpm mutate:runtime --shard ${{ matrix.shard }}/4 --incremental $force --concurrency 4
      - uses: actions/upload-artifact@v7
        with:
          name: stryker-shard-${{ matrix.shard }}
          path: reports/
          retention-days: 7

  report:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: stryker-shard-*
          path: shards
      - run: node scripts/mutate-runtime.ts --merge shards/*
      - run: echo "$KEY" > reports/stryker-incremental.key
        env:
          KEY: ${{ hashFiles('pnpm-lock.yaml', 'stryker.config.ts', 'vitest.stryker.config.ts') }}
      - uses: actions/upload-artifact@v7
        with:
          name: stryker
          path: reports/mutation/
      - uses: actions/upload-artifact@v7
        with:
          name: stryker-incremental
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.key
          retention-days: 35
