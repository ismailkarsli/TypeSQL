name: benchmark

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/bench/history.ts
      - name: Update performance numbers
        id: update
        run: |
          node scripts/performance-history.ts --refresh-all
          git add README.md packages/bench/history.json packages/docs/.vitepress/benchmarks.json
          if git diff --cached --quiet; then
            sha=$(git rev-parse HEAD)
          else
            sha=$(node scripts/github-commit.ts main "chore: update performance numbers")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            packages/bench/results.json
            packages/bench/runtime-results.json
            packages/bench/history-results.json

  docs:
    needs: benchmark
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.benchmark.outputs.sha }}
    secrets: inherit
